<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말해봐 · 2차 MVP</title>
<style>
  :root{
    --ink:#171512;--paper:#FBF9F4;--line:#E4DED2;--muted:#8A8272;
    --signal:#C4442E;--ok:#3E7C5A;--card:#FFFFFF;--live:#C4442E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Malgun Gothic",-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .logo{font-size:30px;font-weight:800;letter-spacing:-1px}
  .badge{font-size:11px;font-weight:700;color:#fff;background:var(--signal);padding:3px 8px;border-radius:2px;letter-spacing:.5px}
  .tag{margin-left:auto;font-size:12px;color:var(--muted)}
  .qlabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:26px 0 12px}
  .question{font-size:26px;font-weight:700;line-height:1.4;letter-spacing:-.5px}
  .qcount{font-size:13px;color:var(--muted);margin-top:10px}
  .mic-row{display:flex;align-items:center;gap:14px;margin:24px 0 4px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:0 0 auto}
  .dot.live{background:var(--live);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .mic-status{font-size:14px;color:var(--muted)}
  .meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 4px}
  .meter .fill{height:100%;width:0;background:var(--ink);transition:width .08s}
  .timer{font-variant-numeric:tabular-nums;font-size:80px;font-weight:800;letter-spacing:-3px;line-height:1;margin:24px 0 4px}
  .timer small{font-size:24px;font-weight:600;color:var(--muted);margin-left:6px}
  .hint{font-size:14px;color:var(--muted);min-height:20px}
  .controls{display:flex;gap:12px;margin-top:26px}
  button{font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;border:none;border-radius:6px;padding:18px 20px;flex:1;transition:.12s}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);flex:0 0 auto;padding:18px 22px}
  button:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
  .result{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:20px 22px;display:none}
  .result.show{display:block}
  .result h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:9px 8px;font-size:14px;border-bottom:1px solid var(--line)}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  th:first-child,td:first-child{text-align:left}
  tr.latest td{font-weight:800}
  .verdict{margin-top:16px;font-size:14px;line-height:1.55}
  .verdict b{color:var(--ok)}
  .verdict .warn{color:var(--signal)}
  .flag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;background:#F3E6E1;color:var(--signal);margin-left:6px}
  .flag.ok{background:#E4EFE9;color:var(--ok)}
  footer{font-size:11px;color:var(--muted);text-align:center;padding-top:24px}
  .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">말해봐</span>
    <span class="badge">2차 MVP</span>
    <span class="tag">음성 자동 감지 · 속도/압축 구분</span>
  </header>

  <div class="qlabel">예상 질문</div>
  <div class="question" id="question">자기소개 부탁드립니다.</div>
  <div class="qcount" id="qcount">질문 1 / 20</div>

  <div class="mic-row">
    <span class="dot" id="dot"></span>
    <span class="mic-status" id="micStatus">마이크 준비 안 됨</span>
  </div>
  <div class="meter"><div class="fill" id="meter"></div></div>

  <div class="timer" id="timer">0<small>.0초</small></div>
  <div class="hint" id="hint">준비되면 답변 시작을 누르세요. 말을 멈추면 자동으로 측정이 끝납니다.</div>

  <div class="controls">
    <button class="btn-primary" id="mainBtn">답변 시작</button>
    <button class="btn-ghost" id="nextBtn">다음 질문</button>
  </div>

  <div class="result" id="result">
    <h3>회차별 기록</h3>
    <table>
      <thead>
        <tr><th>회차</th><th>발화시간</th><th>말한 분량(어절)</th><th>속도(어절/분)</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="verdict" id="verdict"></div>
    <div class="note">발화시간과 함께 말한 분량을 기록해, 시간이 줄어든 것이 <b>말이 빨라진 것</b>인지 <b>내용을 압축한 것</b>인지 구분합니다. (1차 테스트에서 발견된 문제를 반영한 기능입니다.)</div>
  </div>

  <footer>마이크 음성은 기기 안에서만 처리되며 서버로 전송되지 않습니다</footer>
</div>

<script>
const QUESTIONS = [
  "자기소개 부탁드립니다.",
  "가장 힘들었던 경험과 그것을 어떻게 극복했는지 말해주세요.",
  "본인을 한 문장으로 표현한다면?",
  "우리 회사에 지원한 이유는 무엇인가요?",
  "협업 중 갈등이 생겼을 때 어떻게 해결했나요?",
  "본인의 강점을 한 단어로 말한다면?",
  "본인의 가장 큰 강점은 무엇이라고 생각하나요?",
  "실패했던 경험과 그로부터 배운 점을 말해주세요.",
  "최근에 인상 깊게 본 책이나 콘텐츠 하나를 말해주세요.",
  "5년 후 본인의 모습을 어떻게 그리고 있나요?",
  "본인이 주도적으로 무언가를 이끌었던 경험을 말해주세요.",
  "우리 회사를 한 단어로 표현한다면?",
  "본인의 단점은 무엇이며 어떻게 보완하고 있나요?",
  "새로운 것을 배워야 했던 상황에서 어떻게 접근했나요?",
  "입사 후 첫 한 달의 목표를 한 문장으로 말해주세요.",
  "이 직무에 필요한 역량이 무엇이라고 생각하나요?",
  "학교에서 진행한 프로젝트 중 가장 기억에 남는 것은?",
  "본인이 생각하는 좋은 팀워크란 무엇인가요?",
  "예상과 다른 결과가 나왔을 때 어떻게 대응했나요?",
  "마지막으로 하고 싶은 말이 있나요?"
];

let qIndex=0, records={};
let audioCtx=null, analyser=null, micStream=null, dataArr=null;
let state='idle';           // idle | listening | speaking | done
let startTime=0, lastVoice=0, raf=null;
let recognition=null, transcript='';
const SILENCE_MS = 2000;    // 말 멈춤 2초 → 자동 종료
const VOICE_THRESHOLD = 0.04;

const el = id=>document.getElementById(id);
const timerEl=el('timer'),hintEl=el('hint'),mainBtn=el('mainBtn'),nextBtn=el('nextBtn');
const dot=el('dot'),micStatus=el('micStatus'),meter=el('meter');
const resultEl=el('result'),tbody=el('tbody'),verdictEl=el('verdict');
const questionEl=el('question'),qcountEl=el('qcount');

function fmt(s){return `${Math.floor(s)}<small>.${Math.floor((s%1)*10)}초</small>`;}

async function initMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    dataArr = new Uint8Array(analyser.frequencyBinCount);
    micStatus.textContent='마이크 준비 완료';
    if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){
      micStatus.textContent='마이크 준비 완료 (이 브라우저는 분량 측정 미지원 · Chrome 권장)';
    }
    // 음성 인식(어절 수 측정용) — 지원 브라우저에서만
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      recognition = new SR();
      recognition.lang='ko-KR';
      recognition.continuous=true;
      recognition.interimResults=true;
      recognition.onresult=e=>{
        let t='';
        for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript+' ';
        transcript=t.trim();
      };
    }
    return true;
  }catch(err){
    micStatus.textContent='마이크 권한이 필요합니다';
    return false;
  }
}

function rms(){
  analyser.getByteTimeDomainData(dataArr);
  let sum=0;
  for(let i=0;i<dataArr.length;i++){const v=(dataArr[i]-128)/128;sum+=v*v;}
  return Math.sqrt(sum/dataArr.length);
}

function loop(){
  const level = rms();
  meter.style.width = Math.min(100, level*400)+'%';
  const now = performance.now();

  if(state==='listening' && level>VOICE_THRESHOLD){
    state='speaking';
    startTime=now; lastVoice=now;
    dot.className='dot live';
    micStatus.textContent='답변 감지 중…';
    hintEl.textContent='말을 멈추면 자동으로 종료됩니다.';
    if(recognition){transcript='';try{recognition.start();}catch(e){}}
  }
  if(state==='speaking'){
    if(level>VOICE_THRESHOLD) lastVoice=now;
    const elapsed=(now-startTime)/1000;
    timerEl.innerHTML=fmt(elapsed);
    if(now-lastVoice>SILENCE_MS){ finish(elapsed - SILENCE_MS/1000); return; }
  }
  raf=requestAnimationFrame(loop);
}

mainBtn.addEventListener('click', async ()=>{
  if(state==='idle'||state==='done'){
    if(!audioCtx){ const ok=await initMic(); if(!ok) return; }
    if(audioCtx.state==='suspended') await audioCtx.resume();
    state='listening';
    transcript='';
    timerEl.innerHTML='0<small>.0초</small>';
    dot.className='dot live';
    micStatus.textContent='말씀을 시작하면 측정이 시작됩니다';
    hintEl.textContent='지금부터 소리 내어 답해 보세요.';
    mainBtn.textContent='측정 중…';
    mainBtn.disabled=true; nextBtn.disabled=true;
    loop();
  }
});

function finish(seconds){
  cancelAnimationFrame(raf);
  if(recognition){try{recognition.stop();}catch(e){}}
  state='done';
  dot.className='dot';
  micStatus.textContent='측정 완료';
  meter.style.width='0%';
  mainBtn.textContent='다시 답하기';
  mainBtn.disabled=false; nextBtn.disabled=false;
  hintEl.textContent='방금 답변을 확인하고 다시 답해 보세요.';
  timerEl.innerHTML=fmt(seconds);
  // 어절 수는 실제 음성인식 결과만 사용한다.
  // 추정값을 넣으면 속도가 항상 일정해져 '압축/속도' 판정이 무의미해지므로 null 처리.
  let words = transcript ? transcript.split(/\s+/).filter(Boolean).length : null;
  saveRecord(seconds, words);
}

nextBtn.addEventListener('click', ()=>{
  qIndex=(qIndex+1)%QUESTIONS.length;
  questionEl.textContent=QUESTIONS[qIndex];
  qcountEl.textContent=`질문 ${qIndex+1} / ${QUESTIONS.length}`;
  timerEl.innerHTML='0<small>.0초</small>';
  state='idle';
  mainBtn.textContent='답변 시작';
  micStatus.textContent = audioCtx?'마이크 준비 완료':'마이크 준비 안 됨';
  hintEl.textContent='준비되면 답변 시작을 누르세요. 말을 멈추면 자동으로 측정이 끝납니다.';
  renderTable();
});

function saveRecord(sec, words){
  if(!records[qIndex]) records[qIndex]=[];
  records[qIndex].push({sec, words, wpm: (words!==null&&sec>0)?Math.round(words/(sec/60)):null});
  renderTable();
}

function renderTable(){
  const list=records[qIndex]||[];
  if(list.length===0){resultEl.classList.remove('show');return;}
  resultEl.classList.add('show');
  tbody.innerHTML='';
  list.forEach((r,i)=>{
    const tr=document.createElement('tr');
    if(i===list.length-1) tr.className='latest';
    const w = r.words===null?'—':`${r.words}어절`;
    const s = r.wpm===null?'—':r.wpm;
    tr.innerHTML=`<td>${i+1}회차</td><td>${r.sec.toFixed(0)}초</td><td>${w}</td><td>${s}</td>`;
    tbody.appendChild(tr);
  });
  if(list.length>=2){
    const a=list[0], b=list[list.length-1];
    const timeDrop=a.sec-b.sec;
    const pct=(timeDrop/a.sec*100);
    if(timeDrop>0.5){
      if(a.words===null||b.words===null){
        verdictEl.innerHTML=`시간이 <b>${timeDrop.toFixed(0)}초(${pct.toFixed(0)}%)</b> 줄었습니다. 다만 이 브라우저에서는 <span class="warn">발화 분량을 측정할 수 없어</span> 압축/속도 구분은 불가합니다. (Chrome 권장)`;
        return;
      }
      // 압축인가 속도인가 판정: 속도(wpm) 증가폭이 크면 "말만 빨라짐"
      const wpmUp = b.wpm - a.wpm;
      const wordDrop = a.words - b.words;
      if(wpmUp > 25 && wordDrop < a.words*0.1){
        verdictEl.innerHTML=`시간은 <b>${timeDrop.toFixed(0)}초(${pct.toFixed(0)}%)</b> 줄었지만, 말 속도가 크게 빨라졌습니다.<span class="flag">속도만 빨라짐</span> 분량을 줄여 다시 답해 보세요.`;
      }else{
        verdictEl.innerHTML=`시간이 <b>${timeDrop.toFixed(0)}초(${pct.toFixed(0)}%)</b> 줄었고, 말한 분량도 함께 줄었습니다.<span class="flag ok">내용 압축</span> 좋은 방향입니다.`;
      }
    }else{
      verdictEl.innerHTML=`아직 큰 변화가 없습니다. 핵심만 남기고 다시 답해 보세요.`;
    }
  }else{
    const r=list[0];
    verdictEl.innerHTML = r.sec>60
      ? `<span class="warn">${r.sec.toFixed(0)}초.</span> 다소 깁니다. 한 번 더 답해 개선 여부를 확인해 보세요.`
      : `${r.sec.toFixed(0)}초 기록. 한 번 더 답해 비교해 보세요.`;
  }
}
</script>
</body>
</html>
