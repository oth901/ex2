<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>말해봐 · 2차 MVP</title>

<style>

:root{
  --ink:#171512;
  --paper:#FBF9F4;
  --line:#E4DED2;
  --muted:#8A8272;
  --signal:#C4442E;
  --ok:#3E7C5A;
  --card:#FFFFFF;
  --live:#C4442E;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Pretendard","Malgun Gothic",-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:32px 20px 60px;
}

header{
  display:flex;
  align-items:baseline;
  gap:12px;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}

.badge{
  font-size:11px;
  font-weight:700;
  color:#fff;
  background:var(--signal);
  padding:3px 8px;
  border-radius:2px;
  letter-spacing:.5px;
}

.tag{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.qlabel{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:26px 0 12px;
}

.question{
  font-size:26px;
  font-weight:700;
  line-height:1.4;
  letter-spacing:-.5px;
}

.qcount{
  font-size:13px;
  color:var(--muted);
  margin-top:10px;
}

.mic-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin:24px 0 4px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--line);
  flex:0 0 auto;
}

.dot.live{
  background:var(--live);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.mic-status{
  font-size:14px;
  color:var(--muted);
}

.meter{
  height:8px;
  background:var(--line);
  border-radius:4px;
  overflow:hidden;
  margin:14px 0 4px;
}

.meter .fill{
  height:100%;
  width:0;
  background:var(--ink);
  transition:width .08s;
}

.timer{
  font-variant-numeric:tabular-nums;
  font-size:80px;
  font-weight:800;
  letter-spacing:-3px;
  line-height:1;
  margin:24px 0 4px;
}

.timer small{
  font-size:24px;
  font-weight:600;
  color:var(--muted);
  margin-left:6px;
}

.hint{
  font-size:14px;
  color:var(--muted);
  min-height:20px;
}

.controls{
  display:flex;
  gap:12px;
  margin-top:26px;
}

button{
  font-family:inherit;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  border:none;
  border-radius:6px;
  padding:18px 20px;
  flex:1;
  transition:.12s;
}

.btn-primary{
  background:var(--ink);
  color:#fff;
}

.btn-primary:hover{
  transform:translateY(-1px);
}

.btn-ghost{
  background:transparent;
  border:1.5px solid var(--line);
  color:var(--ink);
  flex:0 0 auto;
  padding:18px 22px;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none!important;
}

.result{
  margin-top:26px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  padding:20px 22px;
  display:none;
}

.result.show{
  display:block;
}

.result h3{
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-variant-numeric:tabular-nums;
}

th,
td{
  text-align:right;
  padding:9px 8px;
  font-size:14px;
  border-bottom:1px solid var(--line);
}

th{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.5px;
  font-weight:700;
}

th:first-child,
td:first-child{
  text-align:left;
}

tr.latest td{
  font-weight:800;
}

.verdict{
  margin-top:16px;
  font-size:14px;
  line-height:1.55;
}

.verdict b{
  color:var(--ok);
}

.verdict .warn{
  color:var(--signal);
}

.flag{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:2px 7px;
  border-radius:3px;
  background:#F3E6E1;
  color:var(--signal);
  margin-left:6px;
}

.flag.ok{
  background:#E4EFE9;
  color:var(--ok);
}

.note{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.5;
}

footer{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  padding-top:24px;
}

</style>
</head>


<body>

<div class="wrap">

<header>

  <span class="logo">
    말해봐
  </span>

  <span class="badge">
    2차 MVP
  </span>

  <span class="tag">
    음성 자동 감지 · 속도/압축 구분
  </span>

</header>


<div class="qlabel">
  예상 질문
</div>


<div class="question" id="question">
  자기소개 부탁드립니다.
</div>


<div class="qcount" id="qcount">
  질문 1 / 10
</div>


<div class="mic-row">

  <span
    class="dot"
    id="dot"
  ></span>

  <span
    class="mic-status"
    id="micStatus"
  >
    마이크 준비 안 됨
  </span>

</div>


<div class="meter">

  <div
    class="fill"
    id="meter"
  ></div>

</div>


<div class="timer" id="timer">
  0<small>.0초</small>
</div>


<div class="hint" id="hint">
  준비되면 답변 시작을 누르세요. 말을 멈추면 자동으로 측정이 끝납니다.
</div>


<div class="controls">

  <button
    class="btn-primary"
    id="mainBtn"
  >
    답변 시작
  </button>

  <button
    class="btn-ghost"
    id="nextBtn"
  >
    다음 질문
  </button>

</div>


<div class="result" id="result">

  <h3>
    회차별 기록
  </h3>

  <table>

    <thead>

      <tr>
        <th>회차</th>
        <th>발화시간</th>
        <th>말한 분량(어절)</th>
        <th>속도(어절/분)</th>
      </tr>

    </thead>

    <tbody id="tbody"></tbody>

  </table>


  <div
    class="verdict"
    id="verdict"
  ></div>


  <div class="note">

    발화시간과 함께 말한 분량을 기록해,
    시간이 줄어든 것이

    <b>말이 빨라진 것</b>인지

    <b>내용을 압축한 것</b>인지 구분합니다.

    (1차 테스트에서 발견된 문제를 반영한 기능입니다.)

  </div>

</div>


<footer>
  마이크 음성은 기기 안에서만 처리되며 서버로 전송되지 않습니다
</footer>

</div>



<!-- ==========================================
     Supabase 라이브러리
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   Supabase 연결
========================================== */

const SUPABASE_URL =
  "https://hvrylmuvbleqfmbnfcac.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_5GBlXR4oF9gX5SUfZKWoOQ_9RSyNPvA";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ==========================================
   참여자 ID 입력
========================================== */

let participantId =
  sessionStorage.getItem(
    "participant_id_v2"
  );


if(!participantId){

  participantId =
    window.prompt(
      "참여자 번호를 입력해주세요.\n예: P1"
    );


  if(!participantId){

    participantId =
      "TEST";

  }


  participantId =
    participantId
      .trim()
      .toUpperCase();


  sessionStorage.setItem(
    "participant_id_v2",
    participantId
  );

}



/* ==========================================
   질문
========================================== */

const QUESTIONS = [

  {
    q:"자기소개 부탁드립니다.",
    type:"자기소개"
  },

  {
    q:"우리 회사에 지원한 이유는 무엇인가요?",
    type:"지원동기"
  },

  {
    q:"본인의 가장 큰 강점은 무엇이라고 생각하나요?",
    type:"강점·성향"
  },

  {
    q:"가장 힘들었던 경험과 그것을 어떻게 극복했는지 말해주세요.",
    type:"경험질문"
  },

  {
    q:"협업 중 갈등이 생겼을 때 어떻게 해결했나요?",
    type:"경험질문"
  },

  {
    q:"5년 후 본인의 모습을 어떻게 그리고 있나요?",
    type:"지원동기"
  },

  {
    q:"실패했던 경험과 그로부터 배운 점을 말해주세요.",
    type:"경험질문"
  },

  {
    q:"본인의 단점은 무엇이며 어떻게 보완하고 있나요?",
    type:"강점·성향"
  },

  {
    q:"이 직무에 필요한 역량이 무엇이라고 생각하나요?",
    type:"직무역량"
  },

  {
    q:"마지막으로 하고 싶은 말이 있나요?",
    type:"단답"
  }

];



/* ==========================================
   변수
========================================== */

let qIndex = 0;

let records = {};

let audioCtx = null;
let analyser = null;
let micStream = null;
let dataArr = null;

let state = "idle";

let startTime = 0;
let lastVoice = 0;
let raf = null;

let recognition = null;
let transcript = "";

const SILENCE_MS = 2000;
const VOICE_THRESHOLD = 0.04;



/* ==========================================
   DOM
========================================== */

const el =
  id => document.getElementById(id);


const timerEl =
  el("timer");

const hintEl =
  el("hint");

const mainBtn =
  el("mainBtn");

const nextBtn =
  el("nextBtn");

const dot =
  el("dot");

const micStatus =
  el("micStatus");

const meter =
  el("meter");

const resultEl =
  el("result");

const tbody =
  el("tbody");

const verdictEl =
  el("verdict");

const questionEl =
  el("question");

const qcountEl =
  el("qcount");



function currentQuestion(){

  return QUESTIONS[qIndex];

}



function fmt(s){

  return `
    ${Math.floor(s)}
    <small>
      .${Math.floor((s % 1) * 10)}초
    </small>
  `;

}



/* ==========================================
   마이크 초기화
========================================== */

async function initMic(){

  try{

    micStream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true
      });


    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const src =
      audioCtx
      .createMediaStreamSource(
        micStream
      );


    analyser =
      audioCtx
      .createAnalyser();


    analyser.fftSize =
      512;


    src.connect(
      analyser
    );


    dataArr =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    micStatus.textContent =
      "마이크 준비 완료";



    /*
    음성 인식
    */

    const SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if(SR){

      recognition =
        new SR();


      recognition.lang =
        "ko-KR";


      recognition.continuous =
        true;


      recognition.interimResults =
        true;


      recognition.onresult =
        e => {


          let t =
            "";


          for(
            let i = 0;
            i < e.results.length;
            i++
          ){

            t +=
              e.results[i][0].transcript
              +
              " ";

          }


          transcript =
            t.trim();

        };

    }


    return true;

  }

  catch(err){

    console.error(
      "마이크 오류:",
      err
    );


    micStatus.textContent =
      "마이크 권한이 필요합니다";


    return false;

  }

}



/* ==========================================
   음량 측정
========================================== */

function rms(){

  analyser
    .getByteTimeDomainData(
      dataArr
    );


  let sum =
    0;


  for(
    let i = 0;
    i < dataArr.length;
    i++
  ){

    const v =
      (
        dataArr[i] - 128
      )
      /
      128;


    sum +=
      v * v;

  }


  return Math.sqrt(
    sum / dataArr.length
  );

}



/* ==========================================
   음성 자동 감지
========================================== */

function loop(){

  const level =
    rms();


  meter.style.width =
    Math.min(
      100,
      level * 400
    )
    +
    "%";


  const now =
    performance.now();



  /*
  말하기 시작 감지
  */

  if(
    state === "listening"
    &&
    level > VOICE_THRESHOLD
  ){

    state =
      "speaking";


    startTime =
      now;


    lastVoice =
      now;


    dot.className =
      "dot live";


    micStatus.textContent =
      "답변 감지 중…";


    hintEl.textContent =
      "말을 멈추면 자동으로 종료됩니다.";


    if(recognition){

      transcript =
        "";


      try{

        recognition.start();

      }catch(e){}

    }

  }



  /*
  말하는 중
  */

  if(
    state === "speaking"
  ){

    if(
      level > VOICE_THRESHOLD
    ){

      lastVoice =
        now;

    }


    const elapsed =
      (
        now -
        startTime
      )
      /
      1000;


    timerEl.innerHTML =
      fmt(
        elapsed
      );


    /*
    2초간 무음이면 종료
    */

    if(
      now -
      lastVoice
      >
      SILENCE_MS
    ){

      const finalSeconds =
        Math.max(
          0,
          elapsed -
          SILENCE_MS / 1000
        );


      finish(
        finalSeconds
      );


      return;

    }

  }


  raf =
    requestAnimationFrame(
      loop
    );

}



/* ==========================================
   답변 시작
========================================== */

mainBtn.addEventListener(

  "click",

  async () => {


    if(
      state !== "idle"
      &&
      state !== "done"
    ){

      return;

    }


    if(!audioCtx){

      const ok =
        await initMic();


      if(!ok){

        return;

      }

    }


    if(
      audioCtx.state ===
      "suspended"
    ){

      await audioCtx.resume();

    }


    state =
      "listening";


    transcript =
      "";


    timerEl.innerHTML =
      "0<small>.0초</small>";


    dot.className =
      "dot live";


    micStatus.textContent =
      "말씀을 시작하면 측정이 시작됩니다";


    hintEl.textContent =
      "지금부터 소리 내어 답해 보세요.";


    mainBtn.textContent =
      "측정 중…";


    mainBtn.disabled =
      true;


    nextBtn.disabled =
      true;


    loop();

  }

);



/* ==========================================
   답변 종료
========================================== */

function finish(seconds){

  cancelAnimationFrame(
    raf
  );


  if(recognition){

    try{

      recognition.stop();

    }catch(e){}

  }


  state =
    "done";


  dot.className =
    "dot";


  micStatus.textContent =
    "측정 완료";


  meter.style.width =
    "0%";


  mainBtn.textContent =
    "다시 답하기";


  mainBtn.disabled =
    false;


  nextBtn.disabled =
    false;


  hintEl.textContent =
    "방금 답변을 확인하고 다시 답해 보세요.";


  timerEl.innerHTML =
    fmt(
      seconds
    );



  /*
  음성 인식 결과가 있으면 실제 어절 수 사용.
  지원되지 않으면 시간 기반 추정값 사용.
  */

  let words =
    transcript

    ?

    transcript
      .split(/\s+/)
      .filter(Boolean)
      .length

    :

    Math.round(
      seconds * 2.8
    );



  saveRecord(
    seconds,
    words
  );

}



/* ==========================================
   다음 질문
========================================== */

nextBtn.addEventListener(

  "click",

  () => {


    qIndex =
      (
        qIndex + 1
      )
      %
      QUESTIONS.length;


    questionEl.textContent =
      currentQuestion().q;


    qcountEl.textContent =
      `질문 ${qIndex + 1} / ${QUESTIONS.length}`;


    timerEl.innerHTML =
      "0<small>.0초</small>";


    state =
      "idle";


    mainBtn.textContent =
      "답변 시작";


    micStatus.textContent =
      audioCtx
      ?
      "마이크 준비 완료"
      :
      "마이크 준비 안 됨";


    hintEl.textContent =
      "준비되면 답변 시작을 누르세요. 말을 멈추면 자동으로 측정이 끝납니다.";


    renderTable();

  }

);



/* ==========================================
   기록 저장
========================================== */

function saveRecord(
  sec,
  words
){

  if(
    !records[qIndex]
  ){

    records[qIndex] =
      [];

  }


  const wpm =
    sec > 0

    ?

    Math.round(
      words /
      (
        sec / 60
      )
    )

    :

    0;



  /*
  화면용 로컬 기록
  */

  records[qIndex].push({

    sec:
      sec,

    words:
      words,

    wpm:
      wpm

  });



  renderTable();



  /*
  ==============================
  ★ Supabase 저장
  ==============================
  */

  const current =
    currentQuestion();


  const attemptNo =
    records[qIndex].length;


  const logData = {

    participant_id:
      participantId,

    mvp_version:
      2,

    question_id:
      `Q${qIndex + 1}`,

    question_type:
      current.type,

    attempt_no:
      attemptNo,

    duration_sec:
      Number(
        sec.toFixed(2)
      ),

    word_count:
      words

  };



  supabaseClient

    .from(
      "answer_logs"
    )

    .insert(
      logData
    )

    .then(
      ({error}) => {


        if(error){

          console.error(
            "❌ Supabase 저장 실패:",
            error
          );

        }

        else{

          console.log(
            "✅ Supabase 저장 성공:",
            logData
          );

        }

      }

    );

}



/* ==========================================
   결과표
========================================== */

function renderTable(){

  const list =
    records[qIndex]
    ||
    [];


  if(
    list.length === 0
  ){

    resultEl
      .classList
      .remove(
        "show"
      );


    return;

  }


  resultEl
    .classList
    .add(
      "show"
    );


  tbody.innerHTML =
    "";



  list.forEach(
    (r,i) => {


      const tr =
        document.createElement(
          "tr"
        );


      if(
        i ===
        list.length - 1
      ){

        tr.className =
          "latest";

      }


      tr.innerHTML =
        `
        <td>
          ${i + 1}회차
        </td>

        <td>
          ${r.sec.toFixed(0)}초
        </td>

        <td>
          ${r.words}어절
        </td>

        <td>
          ${r.wpm}
        </td>
        `;


      tbody
        .appendChild(
          tr
        );

    }

  );



  if(
    list.length >= 2
  ){

    const a =
      list[0];


    const b =
      list[
        list.length - 1
      ];


    const timeDrop =
      a.sec -
      b.sec;


    const pct =
      timeDrop /
      a.sec *
      100;



    if(
      timeDrop > 0.5
    ){

      const wpmUp =
        b.wpm -
        a.wpm;


      const wordDrop =
        a.words -
        b.words;



      if(
        wpmUp > 25
        &&
        wordDrop <
        a.words * 0.1
      ){

        verdictEl.innerHTML =
          `
          시간은
          <b>
            ${timeDrop.toFixed(0)}초
            (${pct.toFixed(0)}%)
          </b>
          줄었지만,
          말 속도가 크게 빨라졌습니다.

          <span class="flag">
            속도만 빨라짐
          </span>

          분량을 줄여 다시 답해 보세요.
          `;

      }

      else{

        verdictEl.innerHTML =
          `
          시간이
          <b>
            ${timeDrop.toFixed(0)}초
            (${pct.toFixed(0)}%)
          </b>
          줄었고,
          말한 분량도 함께 줄었습니다.

          <span class="flag ok">
            내용 압축
          </span>

          좋은 방향입니다.
          `;

      }

    }

    else{

      verdictEl.innerHTML =
        `
        아직 큰 변화가 없습니다.
        핵심만 남기고 다시 답해 보세요.
        `;

    }

  }

  else{

    const r =
      list[0];


    verdictEl.innerHTML =
      r.sec > 60

      ?

      `
      <span class="warn">
        ${r.sec.toFixed(0)}초.
      </span>

      다소 깁니다.
      한 번 더 답해 개선 여부를 확인해 보세요.
      `

      :

      `
      ${r.sec.toFixed(0)}초 기록.
      한 번 더 답해 비교해 보세요.
      `;

  }

}

</script>

</body>

</html>
